<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="ct cd">
  <title id="ct">A Telegram chat where one reply is edited as the agent works</title>
  <desc id="cd">You send a task. The bot answers with one message that updates in place: reading files, running a command, then the result with Diff, Status and End buttons.</desc>
  <style>
    .out { animation: outb 11s ease-out infinite; }
    @keyframes outb { 0%, 3% { opacity: 0; transform: translateY(10px); } 7%, 93% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    .s1 { animation: st1 11s linear infinite; } .s2 { animation: st2 11s linear infinite; } .s3 { animation: st3 11s linear infinite; }
    @keyframes st1 { 0%, 11% { opacity: 0; } 13%, 33% { opacity: 1; } 35%, 100% { opacity: 0; } }
    @keyframes st2 { 0%, 34% { opacity: 0; } 36%, 56% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes st3 { 0%, 57% { opacity: 0; transform: translateY(4px); } 60%, 93% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    .typ { animation: blink 1.2s infinite; } .typ2 { animation-delay: .2s; } .typ3 { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    .cap { animation: cap 11s linear infinite; }
    @keyframes cap { 0%, 11% { opacity: 0; } 13%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="920" height="430" rx="28" fill="#f6f1e7"/>
  <text x="48" y="50" text-anchor="start" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">One message. The reply edits itself while the agent works.</text>
  <text x="48" y="76" text-anchor="start" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400">Illustration of a chat with the bot. The reply below is a single Telegram message.</text>
  <rect x="48" y="96" width="824" height="306" rx="18" fill="#17212b"/>
  <rect x="48" y="96" width="824" height="44" rx="18" fill="#242f3d"/>
  <rect x="48" y="122" width="824" height="18" fill="#242f3d"/>
  <circle cx="80" cy="118" r="13" fill="#2563eb"/>
  <text x="80" y="123" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">T</text>
  <text x="104" y="123" text-anchor="start" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Telegram Agent</text>
  <text x="104" y="136" text-anchor="start" fill="#8a9aa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400"></text>
  <g class="out">
  <rect x="470" y="156" width="382" height="40" rx="12" fill="#2b5278"/>
  <text x="488" y="181" text-anchor="start" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400">Fix the failing test in tests/test_access.py</text>
  <text x="836" y="190" text-anchor="end" fill="#9fb3c8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400">14:02</text>
  </g>
  <g class="s1">
  <rect x="68" y="210" width="430" height="56" rx="12" fill="#182533"/>
  <text x="84" y="233" text-anchor="start" fill="#e4d2ae" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">⏳ Claude · 2s</text>
  <text x="84" y="254" text-anchor="start" fill="#d6dee6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Reading tests/test_access.py</text>
  <circle class="typ" cx="462" cy="252" r="3" fill="#8a9aa9"/><circle class="typ typ2" cx="472" cy="252" r="3" fill="#8a9aa9"/><circle class="typ typ3" cx="482" cy="252" r="3" fill="#8a9aa9"/>
  </g>
  <g class="s2">
  <rect x="68" y="210" width="430" height="76" rx="12" fill="#182533"/>
  <text x="84" y="233" text-anchor="start" fill="#e4d2ae" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">⏳ Claude · 9s</text>
  <text x="84" y="254" text-anchor="start" fill="#8fbf8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">✔ Read 2 files</text>
  <text x="84" y="274" text-anchor="start" fill="#d6dee6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Running python -m unittest</text>
  <circle class="typ" cx="462" cy="272" r="3" fill="#8a9aa9"/><circle class="typ typ2" cx="472" cy="272" r="3" fill="#8a9aa9"/><circle class="typ typ3" cx="482" cy="272" r="3" fill="#8a9aa9"/>
  </g>
  <g class="s3">
  <rect x="68" y="210" width="430" height="176" rx="12" fill="#182533"/>
  <text x="84" y="233" text-anchor="start" fill="#e4d2ae" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">⌛ Claude · 14s · 3 turns</text>
  <text x="84" y="256" text-anchor="start" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Fixed the phone mask. The test expected seven dots</text>
  <text x="84" y="274" text-anchor="start" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">and mask_phone produced six. 206 tests pass.</text>
  <text x="84" y="298" text-anchor="start" fill="#8a9aa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400">Read 2 files · Ran 1 command · Edited app/access.py</text>
  <text x="84" y="318" text-anchor="start" fill="#8a9aa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">What Claude did</text>
  <line x1="84" y1="324" x2="482" y2="324" stroke="#2a3a4b"/>
  <rect x="84" y="338" width="122" height="32" rx="8" fill="#2563eb"/>
  <text x="145" y="359" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Diff</text>
  <rect x="218" y="338" width="122" height="32" rx="8" fill="#243447"/>
  <text x="279" y="359" text-anchor="middle" fill="#d6dee6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Status</text>
  <rect x="352" y="338" width="122" height="32" rx="8" fill="#5c2a2a"/>
  <text x="413" y="359" text-anchor="middle" fill="#ffb4b4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">End</text>
  </g>
  <text class="cap" x="640" y="296" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">The same message, edited in place.</text>
  <text class="cap" x="640" y="316" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">No second reply, no scrolling.</text>
  <path class="cap" d="M560 300 C 530 300, 520 290, 505 275" stroke="#8a5a2b" stroke-width="2" fill="none"/>
  <path class="cap" d="M512 290 L503 273 L521 279" fill="#8a5a2b"/>
</svg>
