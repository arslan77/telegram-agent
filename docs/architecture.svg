<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">A Telegram message runs on your computer and the reply stays in the same chat</title>
  <desc id="desc">A private Telegram message reaches the bot, which checks the phone allowlist and keeps a queue. The bot starts the Cursor CLI on the same computer. The reply is edited into that same Telegram message. The bot does not open a port.</desc>
  <rect width="920" height="450" rx="28" fill="#f6f1e7"/>
  <text x="48" y="56" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Your chat runs the computer. The reply stays in that chat.</text>
  <text x="48" y="84" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">No open port. The bot only calls out to Telegram.</text>

  <circle cx="160" cy="196" r="58" fill="#fffdf8" stroke="#1b1914" stroke-width="2"/>
  <text x="160" y="190" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Telegram</text>
  <text x="160" y="212" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">you</text>

  <circle cx="460" cy="196" r="58" fill="#1b1914"/>
  <text x="460" y="190" text-anchor="middle" fill="#f6f1e7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Bot</text>
  <text x="460" y="212" text-anchor="middle" fill="#e4d2ae" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">allowlist</text>

  <circle cx="760" cy="196" r="58" fill="#fffdf8" stroke="#1b1914" stroke-width="2"/>
  <text x="760" y="190" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Cursor</text>
  <text x="760" y="212" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">this computer</text>

  <path d="M218 178 H402" stroke="#1b1914" stroke-width="2" fill="none"/>
  <path d="M390 172 L404 178 L390 184" fill="#1b1914"/>
  <text x="310" y="166" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">message</text>

  <path d="M518 178 H702" stroke="#1b1914" stroke-width="2" fill="none"/>
  <path d="M690 172 L704 178 L690 184" fill="#1b1914"/>
  <text x="610" y="166" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">agent</text>

  <path d="M760 254 C 760 348, 160 348, 160 254" stroke="#8a5a2b" stroke-width="2.5" fill="none"/>
  <path d="M154 270 L160 252 L166 270" fill="#8a5a2b"/>
  <text x="460" y="378" text-anchor="middle" fill="#8a5a2b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">the same message is edited as the work happens</text>

  <text x="160" y="418" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">private chat</text>
  <text x="460" y="418" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">queue survives a restart</text>
  <text x="760" y="418" text-anchor="middle" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">files, shell, and git</text>
</svg>
