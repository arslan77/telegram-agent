    <text x="169.0" y="258" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">gpt</text>
    <rect x="210" y="236" width="70" height="34" rx="9" fill="#ffffff" stroke="#d0d7e2"/>
    <text x="245.0" y="258" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">grok</text>
    <rect class="hl" x="210" y="236" width="70" height="34" rx="9" fill="#2563eb"/>
      <text class="hl" x="245" y="258" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">grok</text>
    <circle class="tap" cx="245" cy="253" r="18" fill="#2563eb"/>
    <rect x="58" y="280" width="70" height="34" rx="9" fill="#ffffff" stroke="#d0d7e2"/>
    <text x="93.0" y="302" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">kimi</text>
    <rect x="134" y="280" width="70" height="34" rx="9" fill="#ffffff" stroke="#d0d7e2"/>
    <text x="169.0" y="302" text-anchor="middle" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">muse</text>
  </g>
