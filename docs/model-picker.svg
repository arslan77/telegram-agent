<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="t d">
  <title id="t">Model picker buttons in Telegram</title>
  <desc id="d">An illustration of the /model button keyboards: tap a Cursor model family, its models appear, tap one. Claude Code shows its aliases.</desc>
  <style>
    .p { animation: show 8s ease-in-out infinite; animation-fill-mode: both; }
    .p2 { animation-delay: .12s; } .p3 { animation-delay: .24s; }
    @keyframes show { 0% { opacity: 0; transform: translateY(8px); } 4%, 94% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    .tap { transform-box: fill-box; transform-origin: center; animation: ripple 8s ease-out infinite; animation-fill-mode: both; }
    @keyframes ripple { 0%, 9% { opacity: 0; transform: scale(.3); } 11% { opacity: .55; } 22%, 100% { opacity: 0; transform: scale(2.4); } }
    .tap2 { animation-delay: 2.9s; }
    .hl { animation: fillin 8s linear infinite; animation-fill-mode: both; }
    @keyframes fillin { 0%, 11% { opacity: 0; } 14%, 94% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .row { animation: slide 8s cubic-bezier(.2,.7,.2,1) infinite; animation-fill-mode: both; }
    @keyframes slide { 0%, 16% { opacity: 0; transform: translateX(-14px); } 22%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    .r2 { animation-delay: .07s; } .r3 { animation-delay: .14s; } .r4 { animation-delay: .21s; } .r5 { animation-delay: .28s; }
    .pick { animation: fillin 8s linear infinite; animation-delay: 2.9s; animation-fill-mode: both; }
    .hint { animation: hint 8s ease-in-out infinite; animation-fill-mode: both; }
    @keyframes hint { 0%, 4% { opacity: 0; } 8%, 60% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="920" height="400" rx="28" fill="#f6f1e7"/>
  <text x="48" y="50" text-anchor="start" fill="#1b1914" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">/model shows buttons for whichever CLI is active</text>
  <text x="48" y="76" text-anchor="start" fill="#5f584e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400">Tap a family, then a model. Illustration of the button layout, not a screenshot.</text>
